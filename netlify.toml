[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://taskflow-zcib.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/ws/*"
  to = "wss://taskflow-zcib.onrender.com/ws/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
